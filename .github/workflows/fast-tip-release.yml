name: q20 fast-tip native release
on:
  workflow_dispatch:
  push:
    branches: [fix/q20-fast-tip]
permissions:
  contents: read
concurrency:
  group: q20-fast-tip-release
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: windows-2025, target: windows-x64}
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install PyInstaller==6.20.0
      - run: node --test checks/dashboard.test.cjs
      - if: runner.os != 'Windows'
        run: |
          python scripts/build_crypto.py
          python -m unittest discover -s tests -v
          python checks/smoke_process.py
          python scripts/package_desktop.py --output artifacts
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/build_crypto.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python checks/smoke_process.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_desktop.py --output artifacts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: q20-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  umbrel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse overwriting an existing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version 0.1.2 already exists; preserve its published assets."
            exit 1
          fi
      - name: Build and test source, crypto and real Core fixture
        run: |
          mkdir -p artifacts
          docker build --platform linux/amd64 --iidfile artifacts/image.iid --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source=https://github.com/QBitLeap/q20 .
          image=$(cat artifacts/image.iid)
          python3 checks/umbrel_integration.py --image "$image" --expected-image-id "$image" --expected-cli-version 0.1.2 --output artifacts/integration.json
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 --mount "type=bind,source=$PWD/checks,target=/opt/q20/checks,readonly" --entrypoint python "$image" /opt/q20/checks/smoke_process.py
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact accepted image and retain public digest receipt
        run: |
          python3 scripts/publish_update.py --image "$(cat artifacts/image.iid)" --integration artifacts/integration.json --output artifacts/q20-update-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: q20-fast-tip-umbrel
          path: artifacts/*
          if-no-files-found: error
  release:
    needs: [desktop, umbrel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect tested native platforms and publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files downloaded
          for target in macos-arm64 macos-x64 windows-x64 linux-x64 linux-arm64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "q20-$target" --dir "downloaded/$target"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name q20-fast-tip-umbrel --dir downloaded/umbrel
          python3 scripts/collect_update_release.py downloaded release-files
          gh release create v0.1.2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "q20 0.1.2" --notes "Faster new-block detection with no idle ledger scans. Preserves existing index data and protocol rules. Native platform and isolated Core integration checks passed; managed installation remains separate." release-files/*
